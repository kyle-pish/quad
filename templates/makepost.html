<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Make Post</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='makepost.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='universal.css') }}">
    </head>
    <body>
        {% include 'header.html' %}
        <main>
            <section id="make-post">
                <div class="container">
                    <form action="/post" method="POST">
                        <label for="post" class="heading">Make a post:</label>
                        <textarea type="text" id="post" name="post" placeholder="Write your thoughts away..."></textarea>

                        <div style="margin: 0.5em 0;">
                            <label>Post visibility:</label>
                            <label style="margin-left:1em;"><input type="radio" name="scope" value="friends" {% if scope != 'group' %}checked{% endif %}> Friends (Home)</label>
                            <label style="margin-left:1em;"><input type="radio" name="scope" value="group" {% if scope == 'group' %}checked{% endif %}> School Group</label>
                        </div>

                        <button type="submit" class="cta text-xl">Post</button>
                        <input type="hidden" name="username" value="{{ session['username'] }}">
                    </form>
                </div>
            </section>
        </main>
        {% include 'footer.html' %}
    </body>
</html>
